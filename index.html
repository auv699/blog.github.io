<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="随机读一篇，轻松一下。">
  <title>JA</title>
  <link rel="icon" href="./favicon.ico">
  <style>
    :root {
      color-scheme: light;
      --ink: #0b0d12;
      --muted: #6b707a;
      --line: #dfe1e5;
      --accent: #92ff4f;
      --page: #f4f5f6;
      --surface: #ffffff;
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; }

    body {
      margin: 0;
      min-height: 100svh;
      padding: 14px;
      color: var(--ink);
      background: var(--page);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    .page {
      width: min(1100px, 100%);
      min-height: calc(100svh - 28px);
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid rgba(11, 13, 18, .08);
      border-radius: var(--radius);
      box-shadow: 0 12px 38px rgba(16, 20, 28, .08);
    }

    .site-header {
      min-height: 88px;
      padding: 0 clamp(24px, 5vw, 56px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      color: var(--ink);
      font-size: 29px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: .08em;
      text-decoration: none;
    }

    .site-nav,
    .link-row {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .site-nav a,
    .link-row a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 22px;
      font-size: 16px;
      font-weight: 650;
      text-underline-offset: 5px;
      text-decoration-thickness: 1px;
      transition: color .18s ease;
    }

    .site-nav a + a,
    .link-row a + a { border-left: 1px solid var(--line); }

    .site-nav a:hover,
    .link-row a:hover { color: #378a09; }

    .site-nav svg,
    .link-row svg {
      width: 17px;
      height: 17px;
      flex: none;
    }

    main {
      width: min(880px, 100%);
      margin: 0 auto;
      padding: clamp(54px, 9vh, 104px) clamp(24px, 6vw, 68px) clamp(38px, 6vh, 68px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .reading {
      margin: auto 0;
      padding: 0;
      border: 0;
    }

    article {
      margin: 0;
      font-size: clamp(27px, 3.15vw, 46px);
      font-weight: 580;
      line-height: 1.72;
      letter-spacing: .035em;
      text-align: left;
      text-wrap: pretty;
    }

    mark {
      color: inherit;
      background: linear-gradient(transparent 61%, var(--accent) 61%, var(--accent) 92%, transparent 92%);
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    .actions {
      padding-top: clamp(48px, 8vh, 82px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }

    .refresh-button {
      min-width: 260px;
      min-height: 68px;
      padding: 16px 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border: 0;
      border-radius: 999px;
      color: var(--ink);
      background: var(--accent);
      box-shadow: 0 10px 24px rgba(98, 210, 34, .2);
      font: inherit;
      font-size: 19px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease;
    }

    .refresh-button:hover {
      transform: translateY(-2px);
      background: #82f63b;
      box-shadow: 0 14px 30px rgba(98, 210, 34, .25);
    }

    .refresh-button:active { transform: translateY(0) scale(.98); }

    .refresh-button svg {
      width: 25px;
      height: 25px;
      transition: transform .45s ease;
    }

    .refresh-button.is-refreshing svg { transform: rotate(180deg); }

    :focus-visible {
      outline: 3px solid rgba(68, 176, 8, .42);
      outline-offset: 4px;
    }

    @media (max-width: 640px) {
      body { padding: 0; background: var(--surface); }

      .page {
        min-height: 100svh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .site-header {
        min-height: 72px;
        padding: 0 24px;
      }

      .brand { font-size: 25px; }
      .site-nav { display: none; }

      main { padding: clamp(54px, 10vh, 92px) 28px 46px; }

      article {
        font-size: clamp(23px, 7vw, 30px);
        line-height: 1.82;
        letter-spacing: .025em;
      }

      .actions { padding-top: 54px; gap: 28px; }

      .link-row a { padding: 0 17px; font-size: 15px; }

      .refresh-button {
        width: 100%;
        min-width: 0;
        min-height: 64px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="./" aria-label="JA 首页">JA</a>
      <nav class="site-nav" aria-label="外部链接">
        <a href="https://v.douyin.com/ihhSTore/" target="_blank" rel="noopener noreferrer">抖音 <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a href="./ip.html">IP查询 <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </nav>
    </header>

    <main>
      <section class="reading" aria-label="随机短文">
        <article aria-live="polite"></article>
      </section>

      <div class="actions">
        <nav class="link-row" aria-label="快捷链接">
          <a href="https://v.douyin.com/ihhSTore/" target="_blank" rel="noopener noreferrer">抖音 <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
          <a href="./ip.html">IP查询 <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        </nav>

        <button class="refresh-button" type="button" onclick="showAnother()">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.93-4M4 4v5h5M4 13a8 8 0 0 0 14.93 4M20 20v-5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>再来一篇</span>
        </button>
      </div>
    </main>
  </div>

  <script src="./assets/js/index.js"></script>
  <script>
    function showAnother() {
      randomSoul();
      const button = document.querySelector('.refresh-button');
      button.classList.remove('is-refreshing');
      void button.offsetWidth;
      button.classList.add('is-refreshing');
      window.setTimeout(() => button.classList.remove('is-refreshing'), 460);
    }

    randomSoul();
  </script>
</body>
</html>
